name: futsal_app
description: "Futsal ground booking app for Nepal — customer, ground owner, and admin roles."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  http: ^1.2.2
  geolocator: ^13.0.2
  supabase_flutter: ^2.17.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  webview_flutter: ^4.14.1
  fl_chart: ^1.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geocoding: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences: ^2.5.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# App icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21

# Launch screen shown while the app starts: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon/splash_logo_android12.png
  web: false
