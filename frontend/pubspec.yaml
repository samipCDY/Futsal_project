name: futsal_app
description: "Futsal ground booking app for Nepal — customer, ground owner, and admin roles."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  http: ^1.2.2
  geolocator: ^13.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  supabase_flutter: ^2.17.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences: ^2.5.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
